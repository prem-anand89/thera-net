<title>HEP Refinements Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mockup chrome on top; a container-query stage shows each screen at desktop or phone width. TheraNet tokens. */
:root{
  --paper:#f5f5f4;--surface:#fff;--ink:#262626;--muted:#5a6064;--border:#e2e2e1;
  --teal:#2c5f63;--teal-strong:#244d50;--teal-light:#e4edec;--teal-mist:#f1f6f5;
  --rust:#a6552f;--rust-light:#f3e4dd;--moss:#5b7a52;--moss-light:#eaf0e7;
  --amber:#80591a;--amber-light:#f6ecd8;--slate:#55636e;--slate-light:#e9edf0;
  --sky:#2f6690;--sky-light:#e3eef6;--plum:#6a4c86;--plum-light:#eee8f4;
  --photo-a:#ecebe8;--photo-b:#dcdad5;--figure:#4a4a48;--on-accent:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);--scrim:rgba(20,24,26,.45);
  --font-display:'Inter',system-ui,sans-serif;--font-sans:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16191a;--surface:#1f2324;--ink:#ecebe8;--muted:#a9b0b2;--border:#33393b;
  --teal:#7fb5b0;--teal-strong:#a4d0cb;--teal-light:#23393a;--teal-mist:#1c2a2b;
  --rust:#e09a76;--rust-light:#3a2820;--moss:#9dbb92;--moss-light:#25301f;--amber:#dcb46a;--amber-light:#362b17;
  --slate:#a9b6c0;--slate-light:#283035;--sky:#8cbbe0;--sky-light:#1d2c3a;--plum:#c1a5dc;--plum-light:#2c2436;
  --photo-a:#2a2e2f;--photo-b:#353a3b;--figure:#cfd2d2;--on-accent:#10201f;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16191a;--surface:#1f2324;--ink:#ecebe8;--muted:#a9b0b2;--border:#33393b;
  --teal:#7fb5b0;--teal-strong:#a4d0cb;--teal-light:#23393a;--teal-mist:#1c2a2b;
  --rust:#e09a76;--rust-light:#3a2820;--moss:#9dbb92;--moss-light:#25301f;--amber:#dcb46a;--amber-light:#362b17;
  --slate:#a9b6c0;--slate-light:#283035;--sky:#8cbbe0;--sky-light:#1d2c3a;--plum:#c1a5dc;--plum-light:#2c2436;
  --photo-a:#2a2e2f;--photo-b:#353a3b;--figure:#cfd2d2;--on-accent:#10201f;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.top h1{font-size:19px;font-weight:600}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pilltabs{display:inline-flex;flex-wrap:wrap;gap:4px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px}
.pilltabs button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.pilltabs button[aria-pressed="true"],.pilltabs button[aria-selected="true"]{background:var(--teal);color:var(--on-accent)}
.note{background:var(--teal-mist);border:1px solid var(--teal-light);border-radius:10px;padding:10px 14px;font-size:13px}
.note b{font-family:var(--font-display);font-weight:600}
.stage{container-type:inline-size;margin:0 auto;width:100%}
.stage.phone{max-width:390px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--teal)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.pill{border-radius:999px}
.muted{color:var(--muted)}.small{font-size:12px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--font-display)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--teal-light);border-color:var(--teal);color:var(--teal-strong);font-weight:500}
.sig{border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.sig.red{background:var(--rust-light);color:var(--rust)}.sig.amber{background:var(--amber-light);color:var(--amber)}.sig.green{background:var(--moss-light);color:var(--moss)}.sig.blue{background:var(--sky-light);color:var(--sky)}.sig.grey{background:var(--slate-light);color:var(--slate)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:none}

/* ===== Patient portal ===== */
.portal-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;justify-items:center;padding:6px 0}
.portal-wrap figure{margin:0;display:grid;gap:8px;justify-items:center}
.portal-wrap figcaption{font-size:12.5px;color:var(--muted);text-align:center;max-width:330px}
.portal-wrap figcaption b{color:var(--ink);font-family:var(--font-display)}
.phone{width:340px;max-width:100%;height:700px;border:9px solid var(--ink);border-radius:34px;background:var(--surface);overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:15px}
.pp-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex:none}
.logo{width:34px;height:34px;border-radius:10px;background:var(--teal);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:var(--font-display)}
.pp-head .nm{font-weight:700;font-size:14px;font-family:var(--font-display)}
.pp-head .ic{margin-left:auto;display:flex;gap:4px}
.pp-head .ic button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.pp-main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.pp-card{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--surface);display:grid;gap:6px}
.pp-card.hero{border-color:var(--teal);background:var(--teal-mist)}
.pp-h{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-family:var(--font-display)}
.pp-big{font-size:17px;font-weight:700;font-family:var(--font-display);line-height:1.25}
.bar{height:8px;border-radius:99px;background:var(--slate-light);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.pbtn{min-height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14.5px;padding:8px 14px}
.pbtn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.pbtn.full{width:100%}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pp-tabs{display:flex;border-top:1px solid var(--border);flex:none;background:var(--surface)}
.pp-tabs button{flex:1;min-height:56px;border:0;background:none;font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center;gap:2px}
.pp-tabs button svg{width:22px;height:22px}
.pp-tabs button[aria-selected="true"]{color:var(--teal-strong);box-shadow:inset 0 3px 0 var(--teal)}
.sess{display:flex;gap:6px}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0}
.ex{border:1px solid var(--border);border-radius:14px;display:grid;grid-template-columns:34px 1fr 14px;gap:10px;align-items:center;padding:10px 12px;background:var(--surface)}
.ex.has-pic{grid-template-columns:34px 64px 1fr 14px}
.ex.done{background:var(--moss-light);border-color:var(--moss)}
.tick{width:30px;height:30px;border-radius:999px;border:2px solid var(--border);display:grid;place-items:center;color:var(--on-accent);font-weight:700;background:none;padding:0}
.ex.done .tick{background:var(--moss);border-color:var(--moss)}
.ex .th{width:64px;aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.ex .t{font-weight:600;font-size:15px;line-height:1.25}
.ex .d{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:20px}
.sticky-start{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(to top,var(--surface) 75%,transparent)}
.dose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dose div{background:var(--paper);border-radius:10px;padding:6px 4px;text-align:center}
.dose b{display:block;font-size:19px;font-family:var(--font-display)}
.dose span{font-size:11.5px;color:var(--muted)}
.setdots{display:flex;gap:8px;flex-wrap:wrap}
.setdots button{width:46px;height:46px;border-radius:999px;border:2px solid var(--teal);background:var(--surface);color:var(--teal-strong);font-weight:700}
.setdots button.on{background:var(--teal);color:var(--on-accent)}
.ex-top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex:none;font-size:13.5px}
.ex-top button{border:0;background:none;color:var(--teal);font-weight:600;padding:6px}
.pic{aspect-ratio:4/3;width:100%;position:relative;flex:none}
.pic svg{width:100%;height:100%;display:block}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.6)}.dots i.on{background:#fff}
.timerband{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--teal-mist);border-bottom:1px solid var(--teal-light)}
.ring{width:58px;height:58px;position:relative;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--font-display);font-size:20px}
.steps{margin:0;padding-left:20px;display:grid;gap:5px}
.stop{background:var(--rust-light);color:var(--rust);border-radius:10px;padding:8px 10px;font-size:13.5px}
.tnote{background:var(--teal-mist);border-radius:10px;padding:8px 10px;font-size:13.5px}
.ex-bottom{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:10px;border-top:1px solid var(--border);flex:none}
.ex-bottom .done{background:var(--moss);border-color:var(--moss);color:var(--on-accent)}
.pin{display:flex;justify-content:center;gap:8px}.pin span{width:46px;height:54px;border:2px solid var(--border);border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700}
.tip{background:var(--sky-light);color:var(--sky);border-radius:10px;padding:8px 10px;font-size:12.5px;text-align:left}

/* ===== Staff app shell ===== */
.app{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pf{padding:16px;display:grid;gap:14px;background:var(--paper)}
.pf-head{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 16px}
.pf-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.pf-name h2{font-size:21px}
.pf-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.pf-meta b{color:var(--ink);font-weight:500}
.pf-actions{display:flex;flex-wrap:wrap;gap:8px}
.pf-grid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@container (min-width:900px){.pf-grid{grid-template-columns:minmax(0,1fr) 300px}.pf-head{grid-template-columns:1fr auto;align-items:start}}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto;background:var(--surface)}
.ptabs button{border:0;background:none;padding:11px 12px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.rail{display:grid;gap:12px}
.rail .card{padding:12px 14px;display:grid;gap:8px}
.rail h3{font-size:13.5px}
.kv{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;font-size:13px}
.banner.amber{background:var(--amber-light);color:var(--amber)}
.banner.red{background:var(--rust-light);color:var(--rust)}
.banner b{color:var(--ink)}

/* Home program tab */
.hp{display:grid;gap:12px}
.prog-switch{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prog-head{padding:14px 16px;display:grid;gap:10px}
.prog-title{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.prog-title h3{font-size:17px}
.prog-sub{font-size:13px;color:var(--muted)}
.prog-bar{display:grid;gap:4px}
.share{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;border-top:1px solid var(--border);padding-top:10px}
.share .st{display:inline-flex;gap:6px;align-items:center;font-weight:500}
.share a,.share button.link{color:var(--teal);background:none;border:0;padding:0;font-size:12.5px;font-weight:500}
.share button.link.danger{color:var(--rust)}
.hp-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@container (min-width:900px){.hp-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.stats div{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.stats .v{font-family:var(--font-display);font-weight:700;font-size:18px}
.stats .s{font-size:11.5px;color:var(--muted)}
.box{padding:12px 14px;display:grid;gap:10px}
.box h4{margin:0;font-family:var(--font-display);font-size:13.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip button{border:0;border-radius:6px;padding:4px 0;display:grid;gap:1px;justify-items:center;font-size:10.5px;background:var(--slate-light);color:var(--muted)}
.strip button b{font-size:12.5px;color:var(--ink);font-family:var(--font-display)}
.strip .f{background:var(--moss-light)}.strip .f b{color:var(--moss)}
.strip .p{background:var(--amber-light)}.strip .p b{color:var(--amber)}
.strip .m{background:var(--rust-light)}.strip .m b{color:var(--rust)}
.strip .t{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.trend{width:100%;height:70px}
.today li{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.today ul{margin:0;padding:0}
.today li:last-child{border-bottom:0}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--font-display);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.grp td{background:var(--paper);font-family:var(--font-display);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:5px 10px}
.mini{display:flex;gap:2px}.mini i{width:7px;height:12px;border-radius:2px;background:var(--border)}.mini i.f{background:var(--moss)}.mini i.p{background:var(--amber)}
.nm-cell{display:flex;gap:8px;align-items:center}.nm-cell .th{width:44px;aspect-ratio:4/3;border-radius:5px;overflow:hidden;flex:none}
.nm-cell b{font-weight:600}
.cards-m{display:none}
@container (max-width:620px){.tbl-wrap{display:none}.cards-m{display:grid;gap:8px}}
.cm{border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.earlier summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:10px 14px}

/* Exercise form media section */
.fsec{border:1px solid var(--teal);box-shadow:0 0 0 1px var(--teal-light);border-radius:12px;background:var(--surface);max-width:720px;margin:0 auto}
.fsec-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.fsec-h .st{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.fsec-b{padding:2px 14px 14px 46px;display:grid;gap:14px}
@container (max-width:460px){.fsec-b{padding-left:14px}}
.f{display:grid;gap:6px}.f>.flabel{font-size:13px;font-weight:500}.hint{font-size:11.5px;color:var(--muted)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photo{width:104px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--border);position:relative}
.photo-add{width:104px;aspect-ratio:4/3;border-radius:8px;border:1.5px dashed var(--border);background:none;color:var(--teal);font-size:12.5px;font-weight:500}
.consent{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px}
.consent.need{border-color:var(--amber);background:var(--amber-light)}
.consent input{width:18px;height:18px;margin-top:2px}
.switch{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.sw{width:38px;height:22px;border-radius:999px;background:var(--border);position:relative;flex:none;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--surface);transition:left .15s}
.sw[aria-checked="true"]{background:var(--teal)}.sw[aria-checked="true"]::after{left:19px}
textarea.input,input.input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--surface);width:100%}
textarea.input{min-height:78px;resize:vertical}
.err{color:var(--rust);font-size:12.5px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div><h1>HEP refinements mockup</h1><p>Clickable. Sample data. Nothing is saved.</p></div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <div class="pilltabs" role="tablist" aria-label="Screen" id="screens"></div>
      <div class="pilltabs" role="group" aria-label="Width"><button type="button" data-width="full" aria-pressed="true">Desktop</button><button type="button" data-width="phone" aria-pressed="false">Phone width</button></div>
    </div>
  </div>
  <div class="note" id="note"></div>
  <div class="stage" id="stage"><div id="view"></div></div>
</div>

<script>
(function(){
const SCREENS=[['portal','Patient portal'],['homeprog','Home program tab'],['profile','Patient profile'],['media','Exercise photos']];
const S={view:'portal',width:'full',portalTab:'home',exOpen:null,done:{},sets:{},timer:null,hp:{prog:0,day:13},media:{photos:2,consent:false,hide:false,tried:false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{const o=JSON.parse(localStorage.getItem('hep-refine')||'{}');if(o.view&&SCREENS.some(s=>s[0]===o.view))S.view=o.view;if(o.width)S.width=o.width}catch(e){}}
function save(){try{localStorage.setItem('hep-refine',JSON.stringify({view:S.view,width:S.width}))}catch(e){}}
function photo(kind,shade){const f='var(--figure)';const L=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${f}" stroke-width="5" stroke-linecap="round"/>`;const H=(x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="${f}"/>`;

 return `<div class="fsec"><div class="fsec-h"><span class="st">2</span><h3 style="font-size:14.5px">Media and instructions</h3></div><div class="fsec-b">

  ${M.photos?`<label class="consent${need&&M.tried?' need':''}"><input type="checkbox" id="consent" ${M.consent?'checked':''}><span><b>I have consent from the person shown</b> to use these pictures with patients. <span class="hint" style="display:block">Recorded with your name and the date.</span></span></label>${need&&M.tried?'<div class="err">Tick consent to save these pictures, or remove them.</div>':''}
   <div class="switch"><button type="button" class="sw" role="switch" aria-checked="${M.hide}" data-hide aria-label="Hide pictures in lists"></button><span><b>Hide pictures in lists</b><span class="hint" style="display:block">Library, picker and the patient's checklist show the name only. The pictures still show on the exercise page itself.</span></span></div>`:''}
  <div class="f"><span class="flabel">Instructions</span><textarea class="input">Stand holding a chair or counter for balance
Rise up onto your toes
Lower slowly</textarea><span class="hint">One step per line. Shown to the patient as numbered steps.</span></div>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn primary" data-trysave>Save exercise</button></div>
  ${M.saved?'<div class="small" style="color:var(--moss)">Saved (mockup).</div>':''}
 </div></div>`;}

const NOTES={
 portal:`<b>Patient portal</b>. Two tabs at the bottom, <b>Home</b> and <b>Exercises</b>, as in the original design.
 <ul style="margin:6px 0 0;padding-left:18px">
 <li><b>Home</b>: the greeting; Today's program with progress and a Start or Continue button; this week; the next clinic visit; package sessions left; other and earlier programs; Book a visit and Call the clinic.</li>
 <li><b>Exercises</b>: the session list by section. A row with no photo shows only the name and dose, with no grey tile.</li>
 <li><b>Exercise page</b>: the photo only when one exists; Sets, Reps and Hold boxes; circles to tick off each set; the timer in a band under the photo; the steps; Stop if.</li></ul>`,
 homeprog:`<b>Home program tab</b> on the patient profile, top to bottom:
 <ul style="margin:6px 0 0;padding-left:18px">
 <li>Program chips, with + New program.</li>
 <li>An alert banner with its actions.</li>
 <li>One program card: actions, a day progress bar, and the patient link (moved up from the bottom).</li>
 <li>One compact stats row.</li>
 <li>The 14-day strip with a pain and effort trend, beside Today.</li>
 <li>A By exercise table grouped Warm-up / Main / Cool-down, with a 7-day mini strip and flags.</li>
 <li>Earlier programs, folded.</li></ul>
 Try Phone width.`,
 profile:`<b>Patient profile</b>, the whole page:
 <ul style="margin:6px 0 0;padding-left:18px">
 <li>One header card with name, status pills, ID, age, phone, condition, referral, next appointment and package, plus Call / WhatsApp / Edit / New visit.</li>
 <li>The tabs right under the header.</li>
 <li>A right rail with Needs attention (notes due, pain to review), Stay, Payments, Care plan and Clinical notes.</li></ul>
 The "Session notes" and admission bars become rail cards, so the tabs start higher.`,
 media:`<b>Exercise photos</b>. When an exercise has pictures, the therapist ticks <b>"I have consent from the person shown"</b> before saving. Pictures then show everywhere, pelvic floor included. A <b>Hide pictures in lists</b> switch per exercise lets the therapist keep them off lists while still showing them on the exercise page. Press Save without ticking to see the check.`};

let tid=null;
function render(){
 $('#screens').innerHTML=SCREENS.map(([k,l])=>`<button type="button" role="tab" data-view="${k}" aria-selected="${S.view===k}">${l}</button>`).join('');
 document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.width===S.width));
 $('#stage').classList.toggle('phone',S.width==='phone');
 $('#note').innerHTML=NOTES[S.view];
 $('#view').innerHTML={portal:viewPortal,homeprog:()=>`<div class="app"><div class="pf">${viewHomeProg()}</div></div>`,profile:viewProfile,media:viewMedia}[S.view]();
 save();
}
function startTimer(id){const e=EX.find(x=>x.id===id);const reps=Math.min(e.reps||1,3),hold=Math.min(e.hold||e.secs||5,4);const ph=[];for(let i=1;i<=reps;i++){ph.push({phase:e.hold?'Hold':'Go',len:hold,rep:i,reps});if(i<reps)ph.push({phase:'Relax',len:2,rep:i,reps});}
 let k=0,end=performance.now()+ph[0].len*1000;S.timerDone=null;S.timer={id,...ph[0],left:ph[0].len};clearInterval(tid);
 tid=setInterval(()=>{const now=performance.now();let left=(end-now)/1000;if(left<=0){k++;if(k>=ph.length){clearInterval(tid);S.timer=null;S.timerDone=id;render();return}end+=ph[k].len*1000;left=(end-now)/1000}S.timer={id,...ph[k],left:Math.max(0,left)};render()},250);render();}
document.addEventListener('click',ev=>{const t=ev.target.closest('button,[data-pex]');if(!t)return;const d=t.dataset;
 if(d.view){S.view=d.view;return render()}
 if(d.width){S.width=d.width;return render()}
 if(d.ptab){S.portalTab=d.ptab;S.exOpen=null;clearInterval(tid);S.timer=null;return render()}
 if(d.ptick){S.done[d.ptick]=!S.done[d.ptick];return render()}
 if(d.pex){S.exOpen=d.pex;clearInterval(tid);S.timer=null;S.timerDone=null;return render()}
 if('pback' in d){S.exOpen=null;S.portalTab='ex';clearInterval(tid);S.timer=null;return render()}
 if(d.pset){const n=+d.n;S.sets[d.pset]=(S.sets[d.pset]||0)>=n?n-1:n;return render()}
 if(d.tstart)return startTimer(d.tstart);
 if('tstop' in d){clearInterval(tid);S.timer=null;return render()}
 if(d.pdone){S.done[d.pdone]=true;S.timerDone=null;const nx=EX.find(e=>!S.done[e.id]);S.exOpen=nx?nx.id:null;if(!nx)S.portalTab='ex';return render()}
 if('addphoto' in d){S.media.photos=Math.min(4,S.media.photos+1);S.media.saved=false;return render()}
 if('rmphoto' in d){S.media.photos=Math.max(0,S.media.photos-1);S.media.saved=false;return render()}
 if('hide' in d){S.media.hide=!S.media.hide;return render()}
 if('trysave' in d){S.media.tried=true;S.media.saved=!(S.media.photos>0&&!S.media.consent);return render()}
});
document.addEventListener('change',ev=>{if(ev.target.id==='consent'){S.media.consent=ev.target.checked;S.media.saved=false;render()}});
load();render();
})();
</script>
