project_id = "thera-net"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public", "storage"]

[auth]
site_url = "http://localhost:5173"

# invite-therapist validates the caller's JWT inside the handler (admin check).
# verify_jwt must be off so the browser's CORS OPTIONS preflight — which never
# carries Authorization — reaches the handler; without this, deploys default
# verify_jwt=true and every invite from the browser fails before the function
# runs (stuck "Sending…" or a CORS error, no invite email).
[functions.invite-therapist]
verify_jwt = false

[functions.brevo-mailer]
enabled = true
verify_jwt = false
import_map = "./functions/brevo-mailer/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/brevo-mailer/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/brevo-mailer/*.html" ]
